name: OnePC Android – Test-App

on:
  push:
    paths:
      - 'onepc-android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: onepc-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: APK bauen
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK benennen
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "OnePC-$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: OnePC-Android
          path: onepc-android/OnePC-*.apk
          if-no-files-found: error

      # Release mit direktem Download-Link fürs Handy. Es wird nie als „latest“
      # markiert, weil das Windows-Programm seine Updates über „latest“ findet.
      - name: Android-Release aktualisieren
        if: github.repository == 'mbverlagberlin-afk/onepc-guard'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v$VERSION"
          cat > notes.md <<'NOTES'
          OnePC für Android – Status, Virenprüfung und Aufräumen deiner PCs vom Handy aus.

          **Installieren:** `OnePC-*.apk` auf dem Handy herunterladen, öffnen und „Aus dieser Quelle installieren“ erlauben. Bei einer Warnung von Google Play Protect „Trotzdem installieren“ wählen.

          **Anmelden:** mit E-Mail-Adresse und Lizenzschlüssel aus der Bestellung bei onemultimedia.de.

          **Voraussetzungen:** OnePC Guard ab 1.1.0 auf dem PC mit eingeschalteter Einstellung „Mit der OnePC-App verbinden“; im Shop das Lizenz-Plugin ab 1.2.0.
          NOTES
          sed -i 's/^          //' notes.md
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --latest=false \
              --title "OnePC für Android $VERSION" --notes-file notes.md
          fi
          gh release upload "$TAG" "OnePC-$VERSION.apk" --clobber
          gh release edit "$TAG" --prerelease=false --latest=false \
            --title "OnePC für Android $VERSION" --notes-file notes.md
