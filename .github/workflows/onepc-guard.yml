name: OnePC Guard – Windows-Installer

on:
  push:
    paths:
      - 'onepc-guard/**'
      - 'onepc-license-server/**'
      - '.github/workflows/onepc-guard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: onepc-guard
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: onepc-guard/package-lock.json

      - run: npm ci

      - run: npm test

      # Öffentlicher Schlüssel aus dem Lizenz-Plugin (WooCommerce → Lizenzen).
      # Steht in config/app.json; optional per Repository-Variable ONEPC_PUBLIC_KEY überschreiben.
      - name: Lizenzschlüssel eintragen
        env:
          PUBLIC_KEY: ${{ vars.ONEPC_PUBLIC_KEY }}
        run: |
          if [ -n "$PUBLIC_KEY" ]; then
            node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('config/app.json','utf8'));c.publicKey=process.env.PUBLIC_KEY;fs.writeFileSync('config/app.json',JSON.stringify(c,null,2))"
          fi
          node -e "if(!require('./config/app.json').publicKey){console.log('::error::Kein publicKey – Lizenzen könnten mit diesem Build nicht aktiviert werden.');process.exit(1)}"

      # Mit einem Code-Signing-Zertifikat (Secrets CSC_LINK und CSC_KEY_PASSWORD)
      # wird der Installer automatisch signiert, sonst bleibt er unsigniert.
      - name: Installer bauen
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: OnePC-Guard-Setup
          path: onepc-guard/dist/*.exe
          if-no-files-found: error

      # Für jede neue Versionsnummer in package.json entsteht genau ein Release.
      # latest.yml und die .blockmap braucht die automatische Aktualisierung im Programm.
      - name: Release veröffentlichen
        if: github.repository == 'mbverlagberlin-afk/onepc-guard'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG gibt es schon. Für ein neues Release die Version in onepc-guard/package.json erhöhen."
            exit 0
          fi

          mkdir -p release
          cp "dist/OnePC-Guard-Setup-$VERSION.exe" "dist/OnePC-Guard-Setup-$VERSION.exe.blockmap" dist/latest.yml release/
          pwsh -NoProfile -Command "Compress-Archive -Path 'dist/OnePC-Guard-Setup-$VERSION.exe' -DestinationPath 'release/OnePC-Guard-Setup-$VERSION.zip'"
          pwsh -NoProfile -Command "Compress-Archive -Path '../onepc-license-server' -DestinationPath 'release/onepc-license-server-$VERSION.zip'"
          pwsh -NoProfile -Command "Compress-Archive -Path 'marketing/*.png','marketing/screenshots' -DestinationPath 'release/onepc-guard-shopbilder.zip'"

          awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > release/notes.md

          gh release create "$TAG" release/*.exe release/*.blockmap release/latest.yml release/*.zip \
            --target "$GITHUB_SHA" \
            --title "OnePC Guard $VERSION" \
            --notes-file release/notes.md \
            --latest
